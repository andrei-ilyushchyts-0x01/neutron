plugins { id "com.android.application" }

def probeKeystore = System.getenv("NEUTRON_PROBE_KEYSTORE")
def probeStorePassword = System.getenv("NEUTRON_PROBE_STORE_PASSWORD")
def probeKeyAlias = System.getenv("NEUTRON_PROBE_KEY_ALIAS")
def probeKeyPassword = System.getenv("NEUTRON_PROBE_KEY_PASSWORD")

android {
    namespace "dev.neutron.probe"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "dev.neutron.probe"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (probeKeystore) {
            research {
                storeFile file(probeKeystore)
                storePassword probeStorePassword
                keyAlias probeKeyAlias
                keyPassword probeKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (probeKeystore) {
                signingConfig signingConfigs.research
            }
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
