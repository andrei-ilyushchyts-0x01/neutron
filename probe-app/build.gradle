import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

plugins {
    id "com.android.application" version "8.7.3" apply false
}

tasks.register("neutronResolvedDependencies") {
    description = "Writes the resolved build and probe dependency graph as deterministic JSON"

    doLast {
        def outputPath = providers.gradleProperty("neutronDependencyOutput").orNull
        if (!outputPath) {
            throw new GradleException("-PneutronDependencyOutput=PATH is required")
        }

        def app = project(":app")
        def inputs = [
            [scope: "build", configuration: buildscript.configurations.classpath],
            [scope: "runtime", configuration: app.configurations.getByName("debugRuntimeClasspath")],
            [scope: "test", configuration: app.configurations.getByName("debugUnitTestRuntimeClasspath")],
        ]
        def components = [:]
        def roots = [] as Set
        def dependencies = [] as Set

        def module = { identifier ->
            if (!(identifier instanceof ModuleComponentIdentifier)) {
                return null
            }
            def id = "${identifier.group}:${identifier.module}:${identifier.version}"
            components[id] = [
                id: id,
                group: identifier.group,
                name: identifier.module,
                version: identifier.version,
            ]
            id
        }

        inputs.each { input ->
            def result = input.configuration.incoming.resolutionResult
            result.allDependencies.each { dependency ->
                if (dependency instanceof UnresolvedDependencyResult) {
                    throw new GradleException(
                        "unresolved ${input.configuration.path} dependency: ${dependency.attempted}",
                        dependency.failure,
                    )
                }
            }

            result.allComponents.each { component ->
                def from = module(component.id)
                if (from == null) {
                    return
                }
                component.dependencies.findAll { it instanceof ResolvedDependencyResult }.each { dependency ->
                    def to = module(dependency.selected.id)
                    if (to != null) {
                        dependencies << "${from}\u0000${to}"
                    }
                }
            }
            result.root.dependencies.findAll { it instanceof ResolvedDependencyResult }.each { dependency ->
                def component = module(dependency.selected.id)
                if (component != null) {
                    roots << "${input.scope}\u0000${component}"
                }
            }
        }

        def document = [
            schema: "neutron.gradle-dependencies/v1",
            gradleVersion: gradle.gradleVersion,
            components: components.values().sort { left, right -> left.id <=> right.id },
            roots: roots.sort().collect { value ->
                def parts = value.split("\u0000", 2)
                [component: parts[1], scope: parts[0]]
            },
            dependencies: dependencies.sort().collect { value ->
                def parts = value.split("\u0000", 2)
                [from: parts[0], to: parts[1]]
            },
        ]
        def output = file(outputPath)
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(document)) + "\n"
    }
}
