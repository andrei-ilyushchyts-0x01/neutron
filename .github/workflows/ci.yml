name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The repo's rust-toolchain.toml pins nightly and lists `bpfel-unknown-none`
  # as a required target. That target has no prebuilt rust-std and breaks
  # rustup auto-install. Each job installs only the targets it needs, so set
  # RUSTUP_TOOLCHAIN per Rust job and let the eBPF job build core explicitly.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    env:
      # Match the nightly rustfmt the project develops against.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  host:
    name: host workspace
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude neutron-ebpf
      - run: cargo test --workspace --exclude neutron-ebpf
      - run: cargo clippy --workspace --exclude neutron-ebpf --all-targets -- -D warnings
      - run: cargo build --release --target aarch64-unknown-linux-musl

  ebpf:
    name: release eBPF object
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo install bpf-linker --version 0.10.3 --locked
      - run: cargo xtask build-ebpf release

  probe:
    name: research probe unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle --no-daemon testDebugUnitTest
        working-directory: probe-app
