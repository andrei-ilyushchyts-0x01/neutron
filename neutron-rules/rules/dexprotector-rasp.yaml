# neutron — DexProtector RASP detector pack
#
# Full pack: bundled default detector pack plus DexProtector-focused RASP
# rules. Keep this file self-contained because `neutron --rules <file>`
# replaces the bundled default pack rather than merging with it.
#
# Rule IDs follow the convention "T<NNN>_<short_slug>". The numbers are local
# to this project and do NOT correspond to MITRE ATT&CK technique IDs.
#
# Schema reference: docs/rules/reference.md

# ─────────────────────────────────────────────────────────────────────────────
# Root / Magisk / Frida detection (the app inspecting itself)
# ─────────────────────────────────────────────────────────────────────────────

- id: T001_proc_self_maps_polling
  name: Periodic /proc/self/maps inspection
  description: >-
    Process repeatedly opens its own memory map. Almost universally used by
    anti-tamper SDKs (RootBeer, custom checks) to scan loaded modules for
    Frida / Magisk / Xposed signatures. Polling cadence is the diagnostic.
  severity: medium
  category: root_detection
  references:
    - "https://attack.mitre.org/techniques/T1518/"
    - "RootBeer: https://github.com/scottyab/rootbeer"
  conditions:
    - syscall_in: [56]              # openat
    - path_prefix: /proc/self/maps
  frequency:
    window_ms: 15000
    min_count: 2
  aggregate: per_process

- id: T002_mountinfo_magisk_check
  name: Mount table inspection (Magisk overlay detection)
  description: >-
    Process reads /proc/self/mountinfo, /proc/mounts, or /proc/<pid>/mountinfo.
    Magisk's hide mechanism leaves traces in the mount namespace; reading these
    is the canonical "is_magisk_by_mount" check.
  severity: medium
  category: root_detection
  conditions:
    - syscall_in: [56]
    - data_any:
        - /proc/self/mountinfo
        - /proc/mounts
        - /proc/self/mounts
  aggregate: per_process

- id: T003_proc_status_tracerpid_scrape
  name: /proc/self/status read (TracerPid / debugger probe)
  description: >-
    Reading /proc/self/status is the standard way to probe for ptrace-based
    debuggers via the TracerPid line. Not a vulnerability — but a strong
    signal that anti-debug logic is active.
  severity: low
  category: antitamper
  conditions:
    - syscall_in: [56]
    - data_any:
        - /proc/self/status
        - /proc/self/stat
  aggregate: per_process

- id: T004_su_binary_probe
  name: Probe for su binary
  description: >-
    Process checks for the presence of a su binary in any of the well-known
    paths. Hits via faccessat/openat/stat/statfs indicate a root-detection
    routine.
  severity: high
  category: root_detection
  references:
    - "RootBeer.checkForBinary()"
  conditions:
    - syscall_in: [56, 48, 79, 78, 43]   # openat, faccessat, fstatat, readlinkat, statfs
    - data_any:
        - /system/bin/su
        - /system/xbin/su
        - /sbin/su
        - /su/bin/su
        - /data/local/su
        - /data/local/xbin/su
        - /data/local/bin/su
        - /system/sd/xbin/su
        - /system/bin/failsafe/su
  aggregate: per_target

- id: T005_magisk_path_probe
  name: Probe for Magisk artifacts
  description: >-
    Path access containing "magisk" or known Magisk locations. Direct evidence
    of Magisk-specific detection.
  severity: high
  category: root_detection
  references:
    - "Magisk: https://github.com/topjohnwu/Magisk"
  conditions:
    - syscall_in: [56, 48, 79, 78, 35, 36]
    - data_any:
        - magisk
        - /sbin/.magisk
        - /cache/.disable_magisk
        - /data/adb/magisk
        - topjohnwu
  aggregate: per_target

- id: T006_frida_artifact_probe
  name: Probe for Frida artifacts
  description: >-
    Path access naming Frida server, gum loop, or known injection artifacts.
    Frida runs an agent in the target process — typical detection looks for
    dropped files or specific thread/library names.
  severity: high
  category: antitamper
  references:
    - "https://frida.re"
  conditions:
    - syscall_in: [56, 48, 79, 78]
    - data_any:
        - frida
        - re.frida.server
        - linjector
        - gum-js-loop
        - gmain
        - /data/local/tmp/re.frida
  aggregate: per_target

- id: T007_xposed_artifact_probe
  name: Probe for Xposed / EdXposed artifacts
  description: >-
    Path access containing Xposed or EdXposed identifiers. Less common in
    modern apps but still routinely included in detection bundles.
  severity: high
  category: antitamper
  conditions:
    - syscall_in: [56, 48, 79, 78]
    - data_any:
        - xposed
        - de.robv.android.xposed
        - EdXposed
        - meowcat.edxposed
        - /system/framework/XposedBridge.jar
  aggregate: per_target

- id: T008_runtime_exec_root_command
  name: Runtime command execution suggestive of root probing
  description: >-
    execve/execveat with arguments referencing su, mount, getprop, which, or
    busybox. Often produced by Runtime.exec("su") or ProcessBuilder probing.
  severity: critical
  category: root_detection
  conditions:
    - syscall_in: [221, 281]         # execve, execveat
    - data_any:
        - "/su"
        - "/system/xbin/which"
        - "/system/bin/mount"
        - "/system/bin/getprop"
        - busybox
  aggregate: per_process

# ─────────────────────────────────────────────────────────────────────────────
# Anti-debug / ptrace / properties
# ─────────────────────────────────────────────────────────────────────────────

- id: T009_ptrace_self_or_remote
  name: ptrace syscall observed
  description: >-
    Any ptrace call is notable in an app process. Often used either as a
    self-debug-attach guard (PTRACE_TRACEME) or to scan for debuggers.
  severity: medium
  category: antitamper
  conditions:
    - syscall_in: [117]              # ptrace (aarch64)
  aggregate: per_process

- id: T010_prctl_dumpable_check
  name: prctl(PR_GET_DUMPABLE) / prctl(PR_SET_DUMPABLE)
  description: >-
    Process queries or modifies its dumpability state. Common anti-debug
    self-hardening: setting PR_SET_DUMPABLE=0 prevents core dumps and ptrace
    by non-root processes.
  severity: low
  category: antitamper
  conditions:
    - syscall_in: [167]              # prctl
    - arg0_in: [3, 4]                # PR_GET_DUMPABLE=3, PR_SET_DUMPABLE=4
  aggregate: per_process

- id: T011_rwx_memory_allocation
  name: RWX or W^X-violating memory mapping
  description: >-
    mmap or mprotect produced a region with PROT_EXEC plus PROT_WRITE. In a
    well-behaved Android app, JIT regions transition W -> X without the
    overlap. RWX allocations are legitimate in some scenarios (custom JITs)
    but always worth recording as evidence.
  severity: high
  category: memory
  conditions:
    - syscall_in: [222, 226]         # mmap, mprotect
    - rwx_alert_in: ["RWX", "WX"]
  aggregate: every_event

# ─────────────────────────────────────────────────────────────────────────────
# Reconnaissance / properties / SELinux
# ─────────────────────────────────────────────────────────────────────────────

- id: T012_proc_net_enumeration
  name: Local socket / port enumeration
  description: >-
    Process reads /proc/net/tcp* or /proc/net/unix. A common Frida-detection
    path is to scan for the default Frida server port (27042) by walking
    /proc/net/tcp.
  severity: medium
  category: network_recon
  conditions:
    - syscall_in: [56]
    - data_any:
        - /proc/net/tcp
        - /proc/net/tcp6
        - /proc/net/udp
        - /proc/net/unix
  aggregate: per_process

- id: T013_selinux_status_check
  name: SELinux enforcement state probe
  description: >-
    Reading /sys/fs/selinux/enforce or /proc/self/attr/current is used to
    detect a permissive bootloader / unlocked device or to derive runtime
    integrity verdicts.
  severity: low
  category: antitamper
  conditions:
    - syscall_in: [56]
    - data_any:
        - /sys/fs/selinux/enforce
        - /sys/fs/selinux/policy
        - /proc/self/attr/current
  aggregate: per_process

- id: T014_property_service_query
  name: Android property service access (build / debuggable probes)
  description: >-
    Access to /dev/__properties__ or the property_service socket. Apps use
    this to read ro.debuggable, ro.build.tags, ro.boot.verifiedbootstate, and
    other tamper-relevant flags. Heavy access from a non-system process is a
    strong signal of integrity logic running.
  severity: low
  category: antitamper
  conditions:
    - syscall_in: [56, 198, 203]     # openat, socket, connect
    - data_any:
        - /dev/__properties__
        - /dev/socket/property_service
  aggregate: per_process

- id: T015_cross_process_proc_inspection
  name: Cross-process /proc inspection
  description: >-
    Process opens /proc/<other_pid>/{maps,cmdline,exe} — i.e. inspects another
    PID. Useful for finding injected helpers, related anti-tamper daemons, or
    to enumerate the device process list. Self-references (/proc/self/) are
    excluded so this rule does not duplicate T001/T002.
  severity: medium
  category: recon
  conditions:
    - syscall_in: [56]
    - path_prefix: /proc/
    - data_any:
        - /maps
        - /cmdline
        - /exe
    - path_not_contains:
        - /proc/self/
        - /proc/thread-self/
    - comm_not_contains:
        - RenderThread
        - FrameMetricsAgg
  aggregate: per_target

# ─────────────────────────────────────────────────────────────────────────────
# Stack-aware rules (D.4) — pattern-match against resolved stack frames
# ─────────────────────────────────────────────────────────────────────────────

- id: T016_native_root_check_via_libc
  name: Native root-binary probe via libc
  description: >-
    fstatat()/newfstatat() on a known root-binary path with libc on the call
    stack. Combines the path-based T004 fingerprint with stack evidence that
    the call originated from native code (typical for hardened SDKs with
    obfuscated checks rather than Java-side File APIs).
  severity: high
  category: root_detection
  conditions:
    - syscall_in: [79]                # newfstatat
    - path_in:
        - /system/xbin/su
        - /system/bin/su
        - /sbin/su
        - /vendor/bin/su
        - /system/sbin/su
    - stack_contains:
        - libc
  frequency:
    window_ms: 5000
    min_count: 1
  aggregate: per_process

- id: T017_jit_cache_syscall
  name: Syscall originating from ART JIT code cache
  description: >-
    A syscall whose user stack top frame lives inside [anon:dalvik-jit-code-cache].
    Most Android apps make all syscalls via libc trampolines, so a frequent JIT
    origin is suspicious — typical of dynamically-loaded integrity / checksum
    code planted by anti-tamper SDKs.
  severity: low
  category: antitamper
  conditions:
    - stack_contains:
        - "<JIT>"
  frequency:
    window_ms: 10000
    min_count: 5
  aggregate: per_process

- id: T018_anti_debug_via_kernel_ptrace
  name: ptrace from native code (anti-debug)
  description: >-
    A ptrace() syscall that resolved to sys_ptrace on the kernel stack and to
    a libc / libnative-* frame on the user stack. This is the classic
    "PTRACE_TRACEME-from-self" anti-debug check that hardened apps use to
    detect attached debuggers.
  severity: medium
  category: antitamper
  conditions:
    - syscall_in: [117]               # ptrace
    - stack_contains:
        - sys_ptrace
        - ptrace
  aggregate: per_process

- id: T019_native_lib_path_inspection
  name: Native shared-library path probing (excluding RenderScript)
  description: >-
    openat() on /system/lib64/* with a non-RenderScript stack. Anti-tamper
    SDKs frequently iterate /system/lib64 looking for hooking frameworks
    (substrate, frida-gadget, libxhook). RenderScript and Skia legitimately
    walk this directory at startup, so we exclude them.
  severity: low
  category: recon
  conditions:
    - syscall_in: [56]
    - path_prefix: /system/lib64/
    - stack_not_contains:
        - RenderScript
        - libRS
        - libskia
  aggregate: per_process

# ─────────────────────────────────────────────────────────────────────────────
# Stack-origin rules (V1.x)
# ─────────────────────────────────────────────────────────────────────────────

- id: T020_native_check_from_anon_mapping
  name: Process introspection from anonymous executable memory
  description: >-
    Process opens /proc/self/{maps,status,cmdline,mountinfo} from a stack frame
    inside an anonymous r-xp mapping ([anon:NNNN]+0xN). This is the classic
    fingerprint of a packed / decrypted native anti-tamper module: code that
    cannot be located by Frida's library-name hooks because its mapping has
    no file backing. Covers what T001/T002/T003 already detect, but at higher
    severity when the call origin is anonymous (the mapping origin IS the
    indicator, not the path being read).
  severity: high
  category: antitamper
  references:
    - "https://attack.mitre.org/techniques/T1027/002/"
  conditions:
    - syscall_in: [56]                # openat
    - path_in:
        - /proc/self/maps
        - /proc/self/status
        - /proc/self/cmdline
        - /proc/self/mountinfo
        - /proc/self/mounts
    - stack_contains:
        - "[anon:"
  aggregate: per_process

- id: T021_frida_thread_comm_scan
  name: Thread-comm enumeration (/proc/self/task/<TID>/comm)
  description: >-
    Process repeatedly opens /proc/self/task/<TID>/comm. The canonical
    Frida-thread-detection pattern: walk all threads in /proc/self/task/ and
    read each thread's comm to look for Frida's named threads
    (gum-js-loop, gmain, gdbus, pool-frida, frida-helper). Library-name
    independent — works against frida-gadget injected as a generic .so.
  severity: medium
  category: antitamper
  references:
    - "https://frida.re/docs/javascript-api/#thread"
  conditions:
    - syscall_in: [56]
    - path_prefix: /proc/self/task/
    - path_contains: /comm
  frequency:
    window_ms: 30000
    min_count: 5
  aggregate: per_process

- id: T022_unexpected_bpf_syscall
  name: bpf(2) syscall from a non-system process
  description: >-
    A plain Android app should never call bpf(2) directly — only system
    services (netd, surfaceflinger debug paths) and explicit tracers do.
    Detecting bpf() in an app process indicates either a debugging build,
    a sophisticated anti-tamper / anti-rootkit module, or an attempt to
    plant a tracer that pretends to be the app. Any of those is worth
    surfacing.
  severity: high
  category: antitamper
  references:
    - "https://man7.org/linux/man-pages/man2/bpf.2.html"
  conditions:
    - syscall_in: [280]               # bpf
    - comm_not_contains:
        - netd
        - traced
        - traced_probes
        - logd
        - surfaceflinger
        - neutron               # avoid self-loops
  aggregate: per_process

# ─────────────────────────────────────────────────────────────────────────────
# DexProtector RASP-focused detectors
# ─────────────────────────────────────────────────────────────────────────────

- id: DP001_dexprotector_boot_libraries
  name: DexProtector native boot library access
  description: >-
    Process accesses DexProtector loader/runtime libraries. DexProtector-protected
    apps commonly stage boot logic through libdpboot.so, libdexprotector.so,
    libdexprotector_h.so, and libdp.so before handing control to protected code.
  severity: medium
  category: antitamper
  references:
    - "https://www.romainthomas.fr/post/26-01-dexprotector/"
    - "https://github.com/romainthomas/dexprotector"
    - "https://licelus.com/products/dexprotector"
  conditions:
    - syscall_in: [56, 48, 79, 78, 43]
    - data_any:
        - libdpboot.so
        - libdexprotector.so
        - libdexprotector_h.so
        - libdp.so
  aggregate: per_target

- id: DP002_dexprotector_asset_blobs
  name: DexProtector packed asset blob access
  description: >-
    Process opens asset blobs used by observed DexProtector samples for packed
    dex/native payloads and runtime metadata.
  severity: medium
  category: antitamper
  references:
    - "https://www.romainthomas.fr/post/26-01-dexprotector/"
    - "https://github.com/romainthomas/dexprotector"
  conditions:
    - syscall_in: [56, 48, 79, 78, 43]
    - data_any:
        - /assets/classes.dex.dat
        - /assets/se.dat
        - /assets/dp.mp3
        - /assets/resources.dat
        - /assets/mm.dat
        - /assets/ic.dat
        - /assets/ct.dat
        - /assets/rcdb.dat
        - classes.dex.dat
        - se.dat
        - dp.mp3
        - resources.dat
        - mm.dat
        - ic.dat
        - ct.dat
        - rcdb.dat
  aggregate: per_target

- id: DP003_dexprotector_native_loader_mapping
  name: DexProtector loader executable memory transition
  description: >-
    A RWX/WX mmap or mprotect originates from a DexProtector loader stack. This
    is consistent with unpacking, relocating, or executing protected native code.
  severity: high
  category: memory
  references:
    - "https://www.romainthomas.fr/post/26-01-dexprotector/"
  conditions:
    - syscall_in: [222, 226]
    - rwx_alert_in: ["RWX", "WX"]
    - stack_contains:
        - libdpboot.so
        - libdexprotector.so
        - libdexprotector_h.so
        - libdp.so
  aggregate: every_event

- id: DP004_dexprotector_proc_maps_rasp
  name: DexProtector RASP process introspection
  description: >-
    DexProtector native code inspects process-local procfs state such as maps,
    status, task, or mounts. These paths are used for anti-debugging, anti-hooking,
    root, emulator, and environment checks.
  severity: high
  category: antitamper
  references:
    - "https://www.romainthomas.fr/post/26-01-dexprotector/"
    - "https://licelus.com/products/dexprotector"
  conditions:
    - syscall_in: [56, 79, 78]
    - data_any:
        - /proc/self/maps
        - /proc/self/status
        - /proc/self/stat
        - /proc/self/task
        - /proc/self/mountinfo
        - /proc/self/mounts
    - stack_contains:
        - libdpboot.so
        - libdexprotector.so
        - libdexprotector_h.so
        - libdp.so
        - "[anon:"
  aggregate: per_process

- id: DP005_dexprotector_frida_hooking_probe
  name: DexProtector Frida and hooking artifact probe
  description: >-
    Process probes Frida, Xposed, Substrate, inline-hook, or gadget artifacts
    that DexProtector RASP commonly treats as instrumentation indicators.
  severity: high
  category: antitamper
  references:
    - "https://licelus.com/products/dexprotector"
    - "https://frida.re"
  conditions:
    - syscall_in: [56, 48, 79, 78, 43]
    - data_any:
        - frida
        - re.frida.server
        - frida-gadget
        - gum-js-loop
        - gmain
        - gdbus
        - xposed
        - EdXposed
        - substrate
        - CydiaSubstrate
        - libsubstrate
        - libxhook
  aggregate: per_target

- id: DP006_dexprotector_root_artifact_probe
  name: DexProtector root artifact probe
  description: >-
    Process probes high-confidence root artifacts through file metadata and
    filesystem checks, including statfs-based su binary detection.
  severity: high
  category: root_detection
  references:
    - "https://licelus.com/products/dexprotector"
    - "https://www.romainthomas.fr/post/26-01-dexprotector/"
  conditions:
    - syscall_in: [56, 48, 79, 78, 43]
    - data_any:
        - /system/bin/su
        - /system/xbin/su
        - /sbin/su
        - /su/bin/su
        - /vendor/bin/su
        - /system/sbin/su
        - /data/local/su
        - /data/local/xbin/su
        - /data/local/bin/su
        - /system/sd/xbin/su
        - /system/bin/failsafe/su
        - /sbin/.magisk
        - /cache/.disable_magisk
        - /data/adb/magisk
        - magisk
        - busybox
  aggregate: per_target

- id: DP007_dexprotector_raw_binder_package_probe
  name: DexProtector raw Binder package-manager probing
  description: >-
    Binder transaction burst from an app during startup. Romain Thomas observed
    DexProtector using raw Binder calls to query installed root-related packages
    instead of the Java PackageManager API; neutron currently cannot decode the
    package strings from binder payloads, so this rule is intentionally a
    medium-confidence startup indicator.
  severity: medium
  category: ipc
  references:
    - "https://www.romainthomas.fr/post/26-01-dexprotector/"
  conditions:
    - binder: true
    - comm_not_contains:
        - system_server
        - surfaceflinger
        - servicemanager
        - hwservicemanager
        - RenderThread
        - FrameMetricsAgg
        - neutron
  frequency:
    window_ms: 5000
    min_count: 20
  aggregate: per_process

- id: DP008_dexprotector_startup_burst
  name: DexProtector startup RASP burst
  description: >-
    Multiple DexProtector/RASP indicators are observed in a short window during
    app cold start. This rule summarizes clustered boot-library, packed-asset,
    procfs, root, and hooking probes.
  severity: high
  category: antitamper
  references:
    - "https://www.romainthomas.fr/post/26-01-dexprotector/"
    - "https://licelus.com/products/dexprotector"
  conditions:
    - syscall_in: [56, 48, 79, 78, 43, 221, 281]
    - data_any:
        - libdpboot.so
        - libdexprotector.so
        - libdexprotector_h.so
        - libdp.so
        - classes.dex.dat
        - se.dat
        - dp.mp3
        - /proc/self/maps
        - /proc/self/status
        - /proc/self/task
        - /proc/self/mountinfo
        - /system/bin/su
        - /system/xbin/su
        - magisk
        - frida
        - xposed
        - substrate
  frequency:
    window_ms: 10000
    min_count: 4
  aggregate: per_process
