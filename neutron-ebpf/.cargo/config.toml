# BPF programs must be compiled with build-std=core for the bpfel-unknown-none target.
# This config is picked up automatically when building this crate.
[build]
target = "bpfel-unknown-none"

[unstable]
build-std = ["core"]

[target.bpfel-unknown-none]
linker = "bpf-linker"
# kernel 6.1+: BPF-to-BPF calls + modern verifier — no rustflag workarounds needed.
