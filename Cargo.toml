[workspace]
members = [
    ".",
    "neutron-common",
    "neutron-ebpf",
    "neutron-rules",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/andrei-ilyushchyts-0x01/neutron"
homepage = "https://github.com/andrei-ilyushchyts-0x01/neutron"
keywords = ["ebpf", "android", "security", "tracing", "bpf"]
categories = ["development-tools::debugging", "command-line-utilities"]
authors = ["neutron contributors"]
rust-version = "1.74"

[package]
name = "neutron"
description = "Android kernel-boundary and cross-service causal tracer for authorized security assessment."
readme = "README.md"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "neutron"
path = "src/lib.rs"

[[bin]]
name = "neutron"
path = "src/main.rs"

[[bin]]
name = "neutron-spike"
path = "src/bin/spike.rs"

[dependencies]
libc           = "0.2"
anyhow         = "1"
clap           = { version = "4", features = ["derive"] }
aya            = "0.13"
bytes          = "1"
log            = "0.4"
env_logger     = "0.11"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
serde_yaml     = "0.9"
sha2           = "0.10"
zip            = { version = "4", default-features = false, features = ["deflate"] }
quick-xml      = "0.41"
goblin         = { version = "0.9", default-features = false, features = ["elf64", "elf32", "endian_fd", "std"] }
neutron-common = { path = "neutron-common", features = ["user"] }
neutron-rules  = { path = "neutron-rules" }

[dev-dependencies]
clap_complete = "4"

# BPF crate uses opt-level=3 even in dev profile so the verifier accepts the
# generated bytecode. Per-package profile overrides must live at workspace
# root (cargo warns and ignores them in non-root packages).
[profile.dev.package.neutron-ebpf]
opt-level = 3
debug = true
